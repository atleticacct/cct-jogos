<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Diagnóstico Auth CCT</title>
<style>
body{font-family:system-ui;background:#07110b;color:#eef8f1;margin:0;min-height:100vh;display:grid;place-items:center;padding:20px}
main{width:min(680px,100%);background:#0d1b12;border:1px solid #294432;border-radius:22px;padding:24px}
button{width:100%;padding:14px;border:0;border-radius:12px;font-weight:800;cursor:pointer}
#login{background:#dff6e6;color:#07110b}.card{margin-top:16px;padding:16px;background:#102318;border:1px solid #294432;border-radius:16px}
.row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid #203728}.row:last-child{border-bottom:0}
.ok{color:#7cf29b}.bad{color:#ff9d9d}.wait{color:#ffd67c}small{color:#9fb2a4}
</style></head><body><main>
<h1>Diagnóstico de acesso CCT</h1>
<p>Teste direto do login Firebase contra a API oficial de produção. Nenhum token é exibido ou salvo.</p>
<button id="login">ENTRAR COM GOOGLE E TESTAR</button>
<section id="result" class="card" hidden>
<div class="row"><span>Status</span><strong id="status" class="wait">Aguardando</strong></div>
<div class="row"><span>Conta Google</span><strong id="email">—</strong></div>
<div class="row"><span>Escopo da API</span><strong id="scope">—</strong></div>
<div class="row"><span>Sócio CCT</span><strong id="socio">—</strong></div>
<div class="row"><span>Membro da Atlética</span><strong id="membro">—</strong></div>
<div class="row"><span>Pessoa reconhecida</span><strong id="nome">—</strong></div>
<div class="row"><span>Agenda interna</span><strong id="agenda">—</strong></div>
<div class="row"><span>Escalas internas</span><strong id="escala">—</strong></div>
<div class="row"><span>Conflitos internos</span><strong id="conflitos">—</strong></div>
<small id="note"></small>
</section>
</main>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script>
const FIREBASE_CONFIG={apiKey:"AIzaSyALm9UE4a7Lvj717Zx35oifn1Sw8yiMZ50",authDomain:"cct-jogos.firebaseapp.com",projectId:"cct-jogos",storageBucket:"cct-jogos.firebasestorage.app",messagingSenderId:"673691151828",appId:"1:673691151828:web:8e8717c64d2693b2027a41"};
const API="https://script.google.com/macros/s/AKfycbwKdhs9Qfkcbnv1fub8p6QFRJ-NWDN-dRZiYj3byaK0_OdTXP3PKksSEuLO27I1hjRkDA/exec";
firebase.initializeApp(FIREBASE_CONFIG); const auth=firebase.auth(); auth.useDeviceLanguage();
const $=id=>document.getElementById(id);
async function testar(){
 $("result").hidden=false;$("status").textContent="Validando…";$("status").className="wait";
 try{
  const provider=new firebase.auth.GoogleAuthProvider();provider.setCustomParameters({prompt:"select_account"});
  const cred=await auth.signInWithPopup(provider);const user=cred.user;$("email").textContent=user.email||"—";
  const token=await user.getIdToken(true);
  const resp=await fetch(API,{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded;charset=UTF-8"},body:new URLSearchParams({token}).toString(),cache:"no-store"});
  const text=await resp.text(); let dados; try{dados=JSON.parse(text)}catch(e){throw new Error("Resposta não JSON: "+text.slice(0,160))}
  if(!resp.ok||dados?.sucesso===false) throw new Error(dados?.erro||("HTTP "+resp.status));
  const a=dados.autorizacao||{};
  $("scope").textContent=dados.escopo||"—";$("socio").textContent=a.socio===true?"SIM":"NÃO";$("membro").textContent=a.membro===true?"SIM":"NÃO";
  $("nome").textContent=a.pessoa?.NOME||a.nome||"Não cadastrado";
  $("agenda").textContent=String((dados.agenda_cct_jiudesc||[]).length);$("escala").textContent=String((dados.escala_responsaveis_jiudesc||[]).length);$("conflitos").textContent=String((dados.conflitos_cct_jiudesc||[]).length);
  const ok=a.membro===true&&dados.escopo==="interno";
  $("status").textContent=ok?"MEMBRO VALIDADO ✓":"LOGIN OK, MAS SEM ACESSO DE MEMBRO";$("status").className=ok?"ok":"bad";
  $("note").textContent=ok?"Backend de produção reconheceu sua conta.":"O backend de produção não reconheceu seu acesso de membro.";
 }catch(err){$("status").textContent="FALHA NO TESTE";$("status").className="bad";$("note").textContent=err?.message||String(err)}
}
$("login").addEventListener("click",testar);
</script></body></html>
